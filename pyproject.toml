# pyproject.toml

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-parking-detector"
version = "0.1.0"
description = "Detección de plazas de parqueo con YOLOv8, Streamlit y MLflow tracking."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Core YOLO/Deep Learning
    "ultralytics==8.3.205",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "ultralytics-thop==2.0.17",
    # Scientific / NumPy stack
    "numpy==2.2.6",
    "scipy==1.16.2",
    "pandas==2.3.3",
    "polars==1.34.0",
    "psutil==7.1.0",
    # CV / Visualización
    "opencv-python==4.12.0.88",
    "matplotlib==3.10.6",
    "pillow==11.3.0",
    # Utilidades varias
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "grpcio==1.75.1",
    "grpcio-tools==1.75.1",
    # Streamlit / demo web
    "streamlit>=1.50.0",
    "altair==5.5.0",
    "pydeck==0.9.1",
    "tenacity==9.1.2",
    "toml==0.10.2",
    "watchdog==6.0.0",
    "tornado==6.5.2",
    # Subset script / utilidades de datos
    "scikit-learn==1.5.2",
    # Pruebas unitarias
    "pytest>=7.4.0",
    "mlflow>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/mluciacaicedo/deteccionParqueadero"
Issues = "https://github.com/mluciacaicedo/deteccionParqueadero/issues"

[project.scripts]
predict-video = "predict_video:main"
start-mlflow-ui = "start_mlflow_ui:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: pruebas lentas que pueden usar el modelo (úsalo con -m 'not slow' para omitir)"
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
